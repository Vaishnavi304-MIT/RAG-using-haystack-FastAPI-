<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haystack FastAPI QA</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:#f4f6f8;

        }

        .container{

            width:900px;
            margin:40px auto;
            background:#fff;
            padding:25px;
            border-radius:10px;
            box-shadow:0 10px 25px rgba(0,0,0,.15);

        }

        h1{

            color:#2563eb;
            margin-bottom:10px;

        }

        p{

            color:#666;
            margin-bottom:20px;

        }

        textarea{

            width:100%;
            min-height:140px;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
            resize:vertical;

        }

        button{

            margin-top:20px;
            padding:12px 25px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;

        }

        button:hover{

            background:#1d4ed8;

        }

        .result{

            margin-top:30px;
            background:#eef4ff;
            border-radius:8px;
            padding:20px;
            display:none;

        }

        .result h2{

            margin-bottom:10px;

        }

        pre{

            white-space:pre-wrap;
            word-break:break-word;

        }

        .error{

            margin-top:20px;
            background:#ffe5e5;
            color:red;
            border-radius:8px;
            padding:20px;
            display:none;

        }

    </style>

</head>

<body>

<div class="container">

    <h1>Haystack Question Answering</h1>

    <p>Ask any question to your RAG chatbot.</p>

    <form id="qa-form">

        <textarea
            id="question"
            placeholder="Type your question..."
            required></textarea>

        <button type="submit">

            Ask Question

        </button>

    </form>

    <div id="answer-box" class="result">

        <h2>Answer</h2>

        <pre id="answer"></pre>

    </div>

    <div id="error-box" class="error">

        <pre id="error"></pre>

    </div>

</div>

<script>

const form=document.getElementById("qa-form");

const answerBox=document.getElementById("answer-box");

const errorBox=document.getElementById("error-box");

const answer=document.getElementById("answer");

const error=document.getElementById("error");

form.addEventListener("submit",async function(e){

    e.preventDefault();

    answerBox.style.display="none";

    errorBox.style.display="none";

    answer.innerHTML="";

    error.innerHTML="";

    const question=document.getElementById("question").value.trim();

    if(question===""){

        return;

    }

    const formData=new FormData();

    formData.append("question",question);

    try{

        answerBox.style.display="block";

        answer.innerHTML="Thinking...";

        const response=await fetch("/get_answer",{

            method:"POST",

            body:formData

        });

        if(!response.ok){

            throw new Error("Server Error");

        }

        const data=await response.json();

        answer.innerHTML=data.answer;

    }

    catch(err){

        answerBox.style.display="none";

        errorBox.style.display="block";

        error.innerHTML=err;

    }

});

</script>

</body>
</html>
